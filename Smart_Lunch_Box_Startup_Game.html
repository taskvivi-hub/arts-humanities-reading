 .reading-tip{display:flex;gap:12px;align-items:flex-start;background:#fff9e9;border:1px solid #f3d9a1;border-radius:14px;padding:14px;margin:16px 0}.tip-icon{font-size:27px}.reading-tip>div:last-child{flex:1;min-width:0}.reading-tip .line{margin-top:6px}.tip-rule{font-size:13px;color:#72572e;margin-top:9px}.bonus-success{background:linear-gradient(120deg,#fff4c9,#e9fff2);border:2px solid #f0ca62;border-radius:14px;padding:14px;margin:12px 0;font-weight:800;color:#315b40}.bonus-pending{background:#f4f7fc;border-radius:12px;padding:12px;margin:12px 0;color:#52637a} @media print{.hero,.actions,footer,.trans{display:none!important}body{background:white}.panel{box-shadow:none}}</style></head><body><main><header class="hero"><div class="eyebrow">ARTS & HUMANITIES · BOOK 1 · LESSON 3</div><h1>🚀 Startup Adventure</h1><div style="font-size:21px;font-weight:700">The Smart Lunch Box Challenge</div><p>Build your startup. Make smart decisions. Win the investment!</p></header><div id="app"></div><footer>Venture Capital · B1 Reading Adventure · No login required</footer></main><script>
const DATA={"partners": {"owl": {"name": "Oliver the Owl", "role": "Business Planner", "emoji": "🦉", "intro": "I love numbers and careful plans. Let’s build a strong business!", "zh": "我喜歡數字和周全的計畫。我們一起打造成功的事業吧！", "advice": ["We need experts with the right skills, not just famous people.", "Check the costs. Keep the feature customers really need.", "Let’s study the survey before we choose our customers.", "Our sales forecast must be realistic. Investors will check our numbers.", "We should understand the investment terms before agreeing."]}, "cat": {"name": "Milo the Cat", "role": "Marketing Expert", "emoji": "🐈", "intro": "I know how to get customers excited. Let’s make our brand famous!", "zh": "我知道怎麼讓顧客對產品感到興奮。讓我們打響品牌知名度！", "advice": ["A good team needs different ideas. I can help with customers!", "Colorful lights would look amazing online! But will people pay more?", "Students care about price. Maybe we should ask office workers, too.", "A big advertising campaign sounds fun, but can we afford it?", "An investor could introduce us to more customers. Let’s hear the offer."]}, "hamster": {"name": "Hazel the Hamster", "role": "Product Engineer", "emoji": "🐹", "intro": "I love solving problems and building useful products. Let’s get started!", "zh": "我喜歡解決問題和打造實用產品。我們開始吧！", "advice": ["We need an engineer who understands temperature control.", "I can simplify the design without losing temperature control.", "Students and office workers may need different features.", "Our factory cannot make 10,000 lunch boxes in one month yet.", "Testing with a small group can help us find problems."]}}, "chapters": [{"title": "Build Your Dream Team", "concept": "A strong management team", "take": "A strong management team needs people with useful talents and expertise.", "takezh": "強大的管理團隊需要具備實用才能與專業知識的人才。", "scene": "You and your partner have started a company. You need a team with the right skills.", "scenezh": "你和合夥人創立了一家公司。你們需要具備合適技能的團隊。", "questions": [{"q": "Your Smart Lunch Box needs help with product development. Who should you hire?", "zh": "智慧便當盒需要有人協助產品開發。你應該聘請誰？", "options": [{"en": "A famous influencer with no product experience.", "zh": "沒有產品經驗的知名網紅。", "points": 0, "feedback": "Popularity may help marketing, but your core product needs technical expertise.", "feedbackzh": "知名度可能有助行銷，但核心產品需要技術專業。"}, {"en": "An engineer who understands temperature-control technology.", "zh": "了解溫控技術的工程師。", "points": 10, "feedback": "Excellent! Your team needs experts who understand its core product.", "feedbackzh": "非常好！你的團隊需要了解核心產品的專家。"}, {"en": "A friendly student who wants to learn about business.", "zh": "一位想學習商業知識、態度友善的學生。", "points": 5, "feedback": "Motivation helps, but you still need relevant expertise.", "feedbackzh": "積極的態度有幫助，但你仍需要相關專業能力。"}]}, {"q": "Your engineer and marketing assistant disagree about the design. What should you do?", "zh": "工程師和行銷助理對設計意見不同。你該怎麼做？", "options": [{"en": "Ask both to explain their ideas and find a solution together.", "zh": "請雙方說明想法，一起找出解決方法。", "points": 10, "feedback": "Great leadership! Different experts should work together.", "feedbackzh": "很好的領導方式！不同領域的專家應該合作。"}, {"en": "Choose your favorite idea without listening to them.", "zh": "不聽他們的意見，直接選自己喜歡的方案。", "points": 0, "feedback": "Ignoring your team can lead to poor decisions.", "feedbackzh": "忽略團隊意見可能導致不佳的決策。"}, {"en": "Let the engineer decide everything.", "zh": "讓工程師決定所有事情。", "points": 5, "feedback": "Technology matters, but customer needs matter too.", "feedbackzh": "技術很重要，但顧客需求也很重要。"}]}]}, {"title": "Make Your Product Special", "concept": "A unique product", "take": "A unique selling point makes a product different and supports long-term growth.", "takezh": "獨特賣點讓產品與眾不同，並支持長期成長。", "scene": "Your first Smart Lunch Box can keep food hot or cold and connect to an app. But production costs are high.", "scenezh": "第一款智慧便當盒能保溫或保冷，並連接手機應用程式，但生產成本很高。", "questions": [{"q": "How should you improve your Smart Lunch Box?", "zh": "你應該如何改良智慧便當盒？", "options": [{"en": "Add colorful lights, even if the price increases.", "zh": "加入彩色燈光，即使價格提高也沒關係。", "points": 5, "feedback": "Attractive design helps, but higher costs may hurt sales.", "feedbackzh": "吸引人的設計有幫助，但成本提高可能影響銷售。"}, {"en": "Keep temperature control and remove unnecessary extras.", "zh": "保留溫控功能，移除不必要的附加功能。", "points": 10, "feedback": "Excellent! You protect your unique selling point while controlling costs.", "feedbackzh": "非常好！你保留獨特賣點，同時控制成本。"}, {"en": "Remove temperature control to make it cheaper.", "zh": "移除溫控功能，讓產品更便宜。", "points": 0, "feedback": "You removed the feature that makes your product special.", "feedbackzh": "你移除了讓產品與眾不同的功能。"}]}, {"q": "A competitor sells a similar lunch box. What should you do?", "zh": "競爭對手推出類似的便當盒。你該怎麼做？", "options": [{"en": "Copy the competitor’s advertisements.", "zh": "模仿競爭對手的廣告。", "points": 0, "feedback": "Copying ads does not create a unique selling point.", "feedbackzh": "模仿廣告無法創造獨特賣點。"}, {"en": "Lower the price without checking costs.", "zh": "不檢查成本就降價。", "points": 5, "feedback": "Lower prices may attract buyers, but costs still matter.", "feedbackzh": "降價可能吸引買家，但仍須考慮成本。"}, {"en": "Improve the app with features competitors cannot easily copy.", "zh": "改良應用程式，加入對手不易模仿的功能。", "points": 10, "feedback": "Great! Hard-to-copy features support long-term growth.", "feedbackzh": "很棒！難以模仿的功能有助於長期成長。"}]}]}, {"title": "Understand Your Customers", "concept": "A growing market", "take": "A growing market helps a startup reach more customers and expand its market share.", "takezh": "成長中的市場有助新創公司接觸更多顧客並擴大市占率。", "scene": "Your team runs a practice survey of 100 students. They choose what matters most: affordable price 40%, useful features 30%, easy to use 20%, good design 10%.", "scenezh": "你的團隊在遊戲中模擬調查100名學生。最在意的因素為：價格實惠40%、實用功能30%、容易使用20%、良好設計10%。", "questions": [{"q": "What is the best decision based on the survey?", "zh": "根據調查，哪一項是最好的決策？", "options": [{"en": "Make the lunch box expensive to look luxurious.", "zh": "提高價格，讓便當盒看起來很高級。", "points": 0, "feedback": "Most students care about price. This does not match their needs.", "feedbackzh": "多數學生重視價格，這不符合他們的需求。"}, {"en": "Offer useful features at a price students can afford.", "zh": "以學生負擔得起的價格提供實用功能。", "points": 10, "feedback": "Excellent! You considered the two biggest customer needs.", "feedbackzh": "非常好！你考慮了顧客最重視的兩項需求。"}, {"en": "Focus mainly on making it easy to use.", "zh": "主要著重讓產品容易使用。", "points": 5, "feedback": "Ease of use matters, but price and useful features rank higher.", "feedbackzh": "容易使用很重要，但價格和實用功能更受重視。"}]}, {"q": "How can your startup find a growing market?", "zh": "你的新創公司如何找到成長中的市場？", "options": [{"en": "Sell only to students at your university forever.", "zh": "永遠只賣給自己大學的學生。", "points": 0, "feedback": "A very small market may limit growth.", "feedbackzh": "市場太小可能限制成長。"}, {"en": "Start with students, then reach office workers with similar needs.", "zh": "先從學生開始，再拓展到需求相似的上班族。", "points": 10, "feedback": "Strong strategy! Start with a clear market and expand later.", "feedbackzh": "很好的策略！先鎖定明確市場，再逐步擴展。"}, {"en": "Sell to everyone immediately without studying their needs.", "zh": "不研究需求就立刻賣給所有人。", "points": 5, "feedback": "A wider market offers chances, but you need customer research.", "feedbackzh": "更大的市場有機會，但你仍需要研究顧客。"}]}]}, {"title": "Create Your Business Plan", "concept": "A great business plan", "take": "A strong business plan includes product features, financial forecasts, and possible return on investment (ROI).", "takezh": "完善的商業計畫包含產品特色、財務預測及可能的投資報酬率（ROI）。", "scene": "A venture capital firm is interested. Before the meeting, it asks to see your business plan.", "scenezh": "一家創投公司對你們有興趣。見面前，他們要求先看商業計畫。", "questions": [{"q": "What should your business plan include?", "zh": "商業計畫應該包含哪些內容？", "options": [{"en": "Only product photos and colors.", "zh": "只有產品照片和顏色。", "points": 0, "feedback": "Pictures alone will not convince investors.", "feedbackzh": "只有圖片無法說服投資人。"}, {"en": "Product features and comments, but no financial plan.", "zh": "產品特色與評論，但沒有財務計畫。", "points": 5, "feedback": "Useful start, but investors also need financial information.", "feedbackzh": "這是好的開始，但投資人也需要財務資訊。"}, {"en": "Features, target customers, costs, sales forecasts, and possible returns.", "zh": "特色、目標顧客、成本、銷售預測及可能的報酬。", "points": 10, "feedback": "Excellent! This covers the product, market, finances, and returns.", "feedbackzh": "非常好！這涵蓋產品、市場、財務與報酬。"}]}, {"q": "Your partner suggests selling 10,000 lunch boxes in one month, but production is limited. What should you do?", "zh": "合夥人建議一個月賣出一萬個便當盒，但產能有限。你該怎麼做？", "options": [{"en": "Make a realistic forecast based on your budget and capacity.", "zh": "根據預算和產能提出實際的預測。", "points": 10, "feedback": "Investors need realistic financial forecasts.", "feedbackzh": "投資人需要合理的財務預測。"}, {"en": "Use 10,000 because a big number will impress investors.", "zh": "使用一萬個的目標，因為大數字能讓投資人印象深刻。", "points": 0, "feedback": "Unrealistic numbers may reduce investors’ trust.", "feedbackzh": "不切實際的數字可能降低投資人的信任。"}, {"en": "Keep the target but say it may be difficult.", "zh": "保留目標，但說明可能很難達成。", "points": 5, "feedback": "You recognize the risk, but need stronger evidence.", "feedbackzh": "你意識到風險，但仍需要更充分的證據。"}]}]}, {"title": "Face the Investor", "concept": "Be coachable and offer a board seat", "take": "VCs may provide funding and managerial expertise. They may ask for equity and a board seat in return.", "takezh": "創投公司可能提供資金與管理專業知識，並要求股權與董事席次作為交換。", "scene": "Investor Alex likes your idea. Alex explains that VCs fund startups for long-term growth. Successful investors also think about an exit strategy and future returns.", "scenezh": "投資人Alex喜歡你的構想。他說明創投會為新創公司的長期成長提供資金；成功的投資人也會考慮退場策略與未來報酬。", "questions": [{"q": "Alex suggests testing the lunch box with a small group before a large launch. What should you do?", "zh": "Alex建議正式大量上市前，先找一小群人測試。你該怎麼做？", "options": [{"en": "Reject the advice because your product is perfect.", "zh": "拒絕建議，因為你的產品已經完美。", "points": 0, "feedback": "Good founders stay open to useful advice.", "feedbackzh": "好的創辦人會願意接受有用的建議。"}, {"en": "Listen politely but launch without testing.", "zh": "禮貌聆聽，但仍不測試就上市。", "points": 5, "feedback": "Listening helps, but action matters more.", "feedbackzh": "聆聽有幫助，但實際行動更重要。"}, {"en": "Accept the advice and use feedback to improve the product.", "zh": "接受建議，利用回饋改良產品。", "points": 10, "feedback": "Excellent! Your team is coachable and willing to learn.", "feedbackzh": "非常好！你的團隊願意接受指導並學習。"}]}, {"q": "Alex offers funding but asks for equity and a board seat. What should you do?", "zh": "Alex願意投資，但要求股權和董事席次。你該怎麼做？", "options": [{"en": "Accept immediately without discussing the terms.", "zh": "不討論條件就立刻接受。", "points": 5, "feedback": "Investment helps, but you must understand the terms.", "feedbackzh": "投資有幫助，但你必須了解條件。"}, {"en": "Discuss equity, the board seat, and decision-making roles first.", "zh": "先討論股權、董事席次與決策權責。", "points": 10, "feedback": "Excellent! Investors may offer both money and expertise.", "feedbackzh": "非常好！投資人可能同時提供資金和專業知識。"}, {"en": "Refuse because investors should never have a say.", "zh": "拒絕，因為投資人絕對不該參與決策。", "points": 0, "feedback": "VCs often ask for equity and a say in decisions. Consider the offer carefully.", "feedbackzh": "創投通常會要求股權及參與決策的權利，應仔細考慮條件。"}]}]}]};

function tr(en,zh,cls=''){return `<div class="line ${cls}"><div class="words">${en}<div class="zh">${zh}</div></div><button type="button" class="trans" aria-label="Show or hide Chinese translation" title="顯示／隱藏中文翻譯" onclick="toggleZh(this)">譯</button></div>`}
function toggleZh(b){let target=b.previousElementSibling.querySelector('.zh');target.classList.toggle('visible');b.setAttribute('aria-pressed',target.classList.contains('visible')?'true':'false')}
function start(){let p=DATA.partners; $('app').innerHTML=`<section class="panel"><span class="chip">YOUR MISSION</span><h2>Choose Your Startup Partner!</h2>${tr('You are a university student with a big idea: a Smart Lunch Box that keeps food hot or cold and connects to an app. You need funding to launch it. First, choose a partner.','你是一位大學生，有個好點子：一款能保溫或保冷、還能連接手機應用程式的智慧便當盒。你需要資金讓產品上市。首先，選一位合夥人。')}<div class="reading-tip"><div class="tip-icon">📖</div><div><strong>English First · Translation When Needed</strong>${tr('Try reading in English first! If you need help, tap 譯 to see the Chinese translation. Take your time and enjoy your adventure!','先試著閱讀英文！如果需要協助，可以點選「譯」查看中文翻譯。按照自己的步調，享受這趟創業冒險吧！')}<div class="tip-rule">🎯 Bonus challenge: Score 90/100 or higher. You can play again as many times as you like. Using translation does not change your score.</div></div></div><div class="partner-grid" style="margin-top:20px">${Object.entries(p).map(([id,v])=>`<button class="partner-card" onclick="selectPartner('${id}')">${characterArt(id,"card-art")}<span><strong>${v.name}</strong><span class="muted">${v.role}</span></span></button>`).join('')}</div><p class="muted">All three partners can help you succeed. Each has different advice and special moments.</p></section>`}
function selectPartner(id){partner=id;let p=DATA.partners[id];$('app').innerHTML=`<section class="panel"><span class="chip">YOUR CO-FOUNDER</span><div class="who">${characterArt(partner,"avatar-art")}<h2>${p.name}</h2></div><p class="muted">${p.role}</p><div class="bubble">${tr('“'+p.intro+'”','「'+p.zh+'」')}</div>${tr('Together, you will develop the Smart Lunch Box, solve problems, and meet a venture capitalist. You will make 10 decisions. Each is worth 0, 5, or 10 points.','你們將一起開發智慧便當盒、解決問題，並與創投投資人見面。你將做出十項決策，每題可得0、5或10分。')}<div class="actions"><button class="btn" onclick="renderQuestion()">Start Adventure →</button><button class="btn secondary" onclick="start()">Choose Another Partner</button></div></section>`}
function renderQuestion(){locked=false;let c=DATA.chapters[chapter],q=c.questions[question],p=DATA.partners[partner],idx=chapter*2+question,advice=p.advice[chapter];let previous=answers[3]?.points===0&&chapter===2?'Some customers say your lunch box is not different enough from ordinary products.':answers[4]?.points===0&&chapter===3?'Your partner is worried that your business plan may not match customer needs.':answers[7]?.points===0&&chapter===4?'Alex has questions about your very high sales forecast.':'';let previousZh=chapter===2?'有些顧客認為你的便當盒與普通產品沒有足夠差異。':chapter===3?'你的合夥人擔心商業計畫可能不符合顧客需求。':'Alex對你過高的銷售預測提出疑問。';$('app').innerHTML=`<section class="panel"><div class="stats"><span>CHAPTER ${chapter+1} / 5 · DECISION ${idx+1} / 10</span><span>⭐ ${score} / 100</span></div><div class="progress"><div style="width:${idx*10}%"></div></div><h2 style="margin-top:17px">${c.title}</h2><span class="chip">${c.concept}</span><div class="story"><strong>📖 The Story</strong>${tr(c.scene,c.scenezh)}${previous?`<div style="margin-top:9px">${tr(previous,previousZh)}</div>`:''}</div><div class="bubble"><div class="who">${characterArt(partner,"avatar-art")}<span>${p.name} says...</span></div>${tr('“'+advice+'”',adviceZh(partner,chapter))}<button class="btn secondary" style="padding:7px 12px;margin-top:10px;font-size:12px" onclick="togglePartnerNote(this)">💬 Discuss with Partner</button><div class="zh partner-note">${partnerNote(partner,chapter)}</div></div>${chapter===2?`<div class="panel" style="padding:14px;margin:12px 0"><strong>📊 Student Survey (100 students)</strong><div class="muted small">Practice survey in this startup story</div>${[['Affordable price',40],['Useful features',30],['Easy to use',20],['Good design',10]].map(([k,v])=>`<div class="barrow"><span>${k}</span><strong>${v}%</strong></div>`).join('')}<button class="trans" style="margin-top:8px" onclick="toggleChartZh(this)">譯</button><div class="zh">故事中的模擬學生調查（100人）：價格實惠40%、實用功能30%、容易使用20%、良好設計10%。</div></div>`:''}<div class="panel" style="padding:16px;margin:14px 0"><h3>🎯 Your Decision</h3>${tr(q.q,q.zh)}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><strong class="small">Choose ONE answer:</strong><button class="trans" onclick="toggleOptionsZh(this)">譯</button></div><div id="options">${q.options.map((o,i)=>`<button class="choice" id="opt${i}" onclick="choose(${i})"><strong>${'ABC'[i]}.</strong> ${o.en}<div class="zh">${o.zh}</div></button>`).join('')}</div><div id="feedback"></div></div><div id="next" class="actions hidden"><button class="btn" onclick="next()">${idx===9?'See Investment Result 🏆':'Continue Story →'}</button></div></section>`;window.scrollTo(0,0)}
function adviceZh(id,ch){let a={owl:['「我們需要具備合適技能的專家，而不只是名人。」','「檢查成本。保留顧客真正需要的功能。」','「選擇顧客前，先研究調查結果。」','「銷售預測必須合理。投資人會檢查數字。」','「同意前，先了解投資條件。」'],cat:['「好的團隊需要不同想法。我能協助了解顧客！」','「彩色燈光在網路上一定很亮眼！但人們願意多付錢嗎？」','「學生重視價格。或許也該問問上班族。」','「大型廣告活動很有趣，但我們負擔得起嗎？」','「投資人可能幫我們認識更多顧客。先聽聽提案吧。」'],hamster:['「我們需要懂溫控技術的工程師。」','「我能簡化設計，同時保留溫控功能。」','「學生和上班族可能需要不同功能。」','「我們的工廠還無法在一個月做出一萬個便當盒。」','「先找一小群人測試，可以幫我們發現問題。」']};return a[id][ch]}
function partnerNote(id,ch){let notes={owl:['Oliver points to a list of skills your team still needs.','Oliver checks the cost of every extra feature.','Oliver compares customer groups and market size.','Oliver opens a budget sheet and checks the numbers.','Oliver asks you to read the investment terms carefully.'],cat:['Milo suggests listening to both team members.','Milo shows a colorful product advertisement, then asks about its cost.','Milo suggests asking customers what they can afford.','Milo wants a big launch, but asks whether the budget is enough.','Milo thinks Alex may help the brand grow.'],hamster:['Hazel shows you how the temperature-control system works.','Hazel tests a simpler product design.','Hazel asks which features customers really need.','Hazel checks how many lunch boxes the factory can make.','Hazel offers to organize a small product test.']};return notes[id][ch]}
function togglePartnerNote(b){b.nextElementSibling.classList.toggle('visible')}
function toggleChartZh(b){b.nextElementSibling.classList.toggle('visible')}
function toggleOptionsZh(b){document.querySelectorAll('#options .zh').forEach(el=>el.classList.toggle('visible'))}
function choose(i){if(locked)return;locked=true;let q=DATA.chapters[chapter].questions[question],o=q.options[i];score+=o.points;answers.push({chapter,question,points:o.points,answer:i});document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(i===j)b.classList.add('selected')});let label=o.points===10?'🌟 Strong Decision':o.points===5?'🟡 Fair Decision':'🔎 Risky Decision';$('feedback').innerHTML=`<div class="result"><strong>${label} · +${o.points} points</strong><div style="margin-top:7px">${tr(o.feedback,o.feedbackzh)}</div><p class="muted small">Investment Confidence: ${score} / 100</p></div>`;$('next').classList.remove('hidden')}
function next(){if(question===0){question=1;renderQuestion();return}let c=DATA.chapters[chapter];$('app').innerHTML=`<section class="panel"><span class="chip">CHAPTER ${chapter+1} COMPLETE</span><h2>📚 What You Learned</h2>${tr(c.take,c.takezh)}<p class="score">${answers.slice(chapter*2,chapter*2+2).reduce((a,x)=>a+x.points,0)} / 20</p><div class="bubble">${characterArt(partner,"avatar-art")} ${DATA.partners[partner].name}: “We are one step closer to meeting our investor!”</div><div class="actions"><button class="btn" onclick="advance()">${chapter===4?'Meet Your Result →':'Next Chapter →'}</button></div></section>`;window.scrollTo(0,0)}
function advance(){if(chapter<4){chapter++;question=0;renderQuestion()}else finish()}
function finish(){let p=DATA.partners[partner],title=score>=90?'🎉 Investment Approved!':score>=60?'🛠️ Revise and Pitch Again!':'🌱 Investment Declined — For Now',message=score>=90?'Your startup shows strong potential. I am ready to discuss investing!':score>=60?'I like your idea, but improve your business plan and come back.':'Your startup is not ready for investment yet. Learn from your decisions and try again!';let strengths=DATA.chapters.map((c,i)=>({name:c.title,points:answers.slice(i*2,i*2+2).reduce((a,x)=>a+x.points,0)}));$('app').innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:62px">${score>=90?'🏆':score>=60?'🤝':'🌱'}</div><h2>${title}</h2><p class="score">${score} / 100</p>${score>=90?'<div class="bonus-success">🌟 Bonus Challenge Completed! · 90+ points achieved<br><small>Show this result to your teacher to register your participation bonus.</small></div>':'<div class="bonus-pending">🎯 Bonus challenge: Reach 90 points to qualify. You can try again!</div>'}<div class="story">👔 <strong>Investor Alex:</strong> ${tr('“'+message+'”',score>=90?'「你的新創公司展現強大潛力。我願意進一步討論投資！」':score>=60?'「我喜歡你的構想，但請先改善商業計畫，再回來提案。」':'「你的新創公司目前還沒準備好接受投資。從決策中學習，再試一次！」')}</div><div class="bubble">${characterArt(partner,"avatar-art")} <strong>${p.name}:</strong> “We learned a lot about building a startup. Let’s keep improving!”</div></section><section class="panel"><h2>📋 Startup Performance Report</h2>${strengths.map(s=>`<div class="barrow"><span>${s.name}</span><strong>${s.points}/20</strong></div>`).join('')}<p class="muted">Review any chapter below 15 points. Venture capitalists look for a strong team, a unique product, a growing market, a good business plan, and founders who accept guidance.</p>${tr('Silicon Valley is a famous center for technology startups and venture capital. The reading also describes Sequoia Capital’s early investment in Google. VCs consider both potential returns and an exit strategy.','矽谷是著名的科技新創與創投中心。課文也提到紅杉資本早期投資Google的例子。創投會考慮潛在報酬及退場策略。')}<div class="actions"><button class="btn gold" onclick="restart()">🔄 Play Again</button></div></section>`;window.scrollTo(0,0)}
function restart(){partner=null;chapter=0;question=0;score=0;answers=[];locked=false;start()}
start();
</script></body></html>
